<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#24509e"/>
      <stop offset="0.55" stop-color="#14306f"/>
      <stop offset="1" stop-color="#0a1a48"/>
    </radialGradient>
    <radialGradient id="brillo" cx="50%" cy="46%" r="42%">
      <stop offset="0" stop-color="#8fd0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8fd0ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Los mismos colores que el título: NÚMEROS en azul, la Y dorada y PALABRAS en coral -->
    <linearGradient id="azul" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c9ecf7"/>
      <stop offset="1" stop-color="#8ed3e6"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.55" stop-color="#f6dc85"/>
      <stop offset="1" stop-color="#f2b934"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ffdcca"/>
      <stop offset="1" stop-color="#f5a983"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>
  <circle cx="256" cy="240" r="215" fill="url(#brillo)"/>
  <g fill="#9cc3ff" opacity="0.18">
    <circle cx="96" cy="96" r="6"/><circle cx="160" cy="70" r="4"/><circle cx="352" cy="70" r="4"/><circle cx="416" cy="96" r="6"/>
    <circle cx="96" cy="416" r="6"/><circle cx="160" cy="442" r="4"/><circle cx="352" cy="442" r="4"/><circle cx="416" cy="416" r="6"/>
  </g>
  <g font-family="Segoe UI Black, Arial Black, Arial, sans-serif" font-weight="900" text-anchor="middle" transform="translate(256 262) scale(1.12) translate(-256 -262)">
    <!-- N: ficha azul, inclinada como en la bandera del título -->
    <g transform="rotate(-8 148 262)">
      <rect x="84" y="190" width="128" height="150" rx="26" fill="#0a2a4a"/>
      <rect x="84" y="178" width="128" height="150" rx="26" fill="url(#azul)" stroke="#0a2a4a" stroke-width="9"/>
      <rect x="100" y="190" width="70" height="14" rx="7" fill="#ffffff" opacity="0.7"/>
      <text x="148" y="299" font-size="112" fill="#0b3a5c">N</text>
    </g>
    <!-- P: ficha coral -->
    <g transform="rotate(8 364 262)">
      <rect x="300" y="190" width="128" height="150" rx="26" fill="#4a1606"/>
      <rect x="300" y="178" width="128" height="150" rx="26" fill="url(#coral)" stroke="#4a1606" stroke-width="9"/>
      <rect x="316" y="190" width="70" height="14" rx="7" fill="#ffffff" opacity="0.7"/>
      <text x="364" y="299" font-size="112" fill="#6a2310">P</text>
    </g>
    <!-- Y: ficha dorada, más pequeña y por delante -->
    <g transform="rotate(-3 256 300)">
      <rect x="208" y="252" width="96" height="108" rx="22" fill="#5a3d00"/>
      <rect x="208" y="242" width="96" height="108" rx="22" fill="url(#oro)" stroke="#5a3d00" stroke-width="8"/>
      <rect x="220" y="252" width="50" height="10" rx="5" fill="#ffffff" opacity="0.75"/>
      <text x="256" y="327" font-size="80" fill="#5a3d00">Y</text>
    </g>
  </g>
</svg>
